<!DOCTYPE html>
<html>

<head>
  <title>Pimp my Wolt</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #009de0;
      --brand-dark: #007bbd;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --surface: #f5f7fa;
      --success: #1f9d55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.5;
    }

    .settings-panel {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: 2px solid rgba(0, 157, 224, 0.15);
      border-color: var(--brand);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0 20px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      color: var(--text);
    }

    .settings-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    #save-ai-settings {
      background: var(--brand);
      color: #fff;
    }

    #save-ai-settings:hover {
      background: var(--brand-dark);
    }

    #save-ai-settings:active {
      transform: translateY(1px);
    }

    #ai-settings-status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--success);
      font-size: 0.95rem;
    }

    .cache-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cache-header {
      padding: 0 0 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    .cache-entry-name {
      overflow-wrap: anywhere;
    }

    .cache-arrow {
      color: var(--muted);
    }

    .delete-cache-entry {
      display: flex;
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      padding: 0;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #8f1d1d;
      border: none;
      border-radius: 50%;
    }

    .delete-cache-entry::before {
      content: "×";
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(1px);
    }

    .delete-cache-entry:hover {
      background: #6f1616;
    }

    .cache-add-entry input {
      min-width: 0;
      margin: 0;
      padding: 8px 10px;
    }

    .add-cache-entry {
      display: flex;
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      padding: 0;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #1f9d55;
      border: none;
      border-radius: 50%;
    }

    .add-cache-entry::before {
      content: "+";
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .add-cache-entry:hover {
      background: #16813f;
    }

    .empty-cache {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="settings-panel">
    <h2>Automatic name matching</h2>
    <label for="openrouter-api-key">OpenRouter API key:</label>
    <input id="openrouter-api-key" type="password" autocomplete="off">
    <label for="openrouter-model">OpenRouter model identifier:</label>
    <input id="openrouter-model" autocomplete="off" placeholder="provider/model">

    <div class="settings-actions">
      <button id="save-ai-settings" type="button">Save AI settings</button>
    </div>

    <p id="ai-settings-status" role="status"></p>

    <hr>

    <h2>Saved name matches</h2>
    <div id="cached-name-matches" aria-live="polite">
      <div class="cache-entry cache-header" aria-hidden="true">
        <span>Wolt name</span>
        <span></span>
        <span>Cibus name</span>
        <span></span>
      </div>
    </div>
    <p id="cache-status" role="status"></p>
  </div>

  <script type="module" src="set-team-page.js"></script>
</body>

</html>
